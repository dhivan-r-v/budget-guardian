<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Guardian</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
    --accent: #0b5cd5; --accent-text: #ffffff; --ok: #1a7f37; --warn: #9a6700; --bad: #c62828;
    --pill: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --text: #e7eaee; --muted: #9aa4b1; --line: #2a3039;
      --accent: #4c8dff; --accent-text: #0b0e12; --ok: #4ac26b; --warn: #d4a72c; --bad: #ff6b6b;
      --pill: #222831;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .card p { margin: 0 0 12px; }
  .tag { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--pill); color: var(--muted); margin-bottom: 8px; }
  .tag.spike { color: var(--bad); }
  .option { display: flex; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding: 12px 0 0; margin-top: 12px; flex-wrap: wrap; }
  .option span { flex: 1 1 260px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--accent); color: var(--accent-text); white-space: nowrap; }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secondary { background: var(--pill); color: var(--text); }
  button[hidden] { display: none; }
  .confirm { flex: 1 1 100%; background: var(--pill); border-radius: 8px; padding: 12px; }
  .confirm p { margin: 0 0 10px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .status { font-size: 0.9rem; white-space: nowrap; }
  .status.completed { color: var(--ok); } .status.sent, .status.approved { color: var(--warn); } .status.failed { color: var(--bad); }
  .muted { color: var(--muted); font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Budget Guardian</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="advice"></div>
  <h2>Habits</h2>
  <div id="habits"></div>
  <h2>Your approvals</h2>
  <div class="card" id="approvals"><p class="muted">None yet. Nothing moves until you approve.</p></div>
</main>
<script>
const usd = (c) => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? (e.className = v) : (e[k] = v);
  for (const kid of kids) e.append(kid);
  return e;
};
const STATUS_TEXT = { approved: 'Approved, sending…', sent: 'Sent to PayPal', completed: 'Moved to savings', failed: 'Failed' };

let month = null;
let approvals = [];

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || res.statusText), { status: res.status, body });
  return body;
}

// A category's options are alternatives, so one live approval covers the whole category.
function liveApproval(category) {
  return approvals.find((a) => a.category === category && a.month === month && a.status !== 'failed');
}

function optionRow(category, text, option) {
  const row = el('div', { class: 'option' }, el('span', { textContent: text }));
  const live = liveApproval(category);
  if (live?.optionId === option.id) {
    row.append(el('span', { class: `status ${live.status}`, textContent: `${STATUS_TEXT[live.status]} · ${usd(live.amountCents)}` }));
  } else if (live) {
    row.append(el('span', { class: 'muted', textContent: `You chose another plan for ${category} this month` }));
  } else if (option.savingsCents > 0) {
    const button = el('button', { textContent: `Approve · save ${usd(option.savingsCents)}` });
    button.onclick = () => askToConfirm(row, button, option);
    row.append(button);
  }
  return row;
}

// In-page confirmation (browser confirm() dialogs can be blocked silently).
function askToConfirm(row, button, option) {
  button.hidden = true;
  row.querySelector('.confirm')?.remove();
  const yes = el('button', { textContent: `Yes, move ${usd(option.savingsCents)} to savings` });
  const no = el('button', { textContent: 'Cancel', class: 'secondary' });
  const message = el('p', { class: 'muted', textContent: `Budget Guardian will send ${usd(option.savingsCents)} to your savings account through PayPal. Nothing else will happen.` });
  const box = el('div', { class: 'confirm' }, message, el('div', { class: 'actions' }, yes, no));
  no.onclick = () => { box.remove(); button.hidden = false; };
  yes.onclick = () => approveOption(box, yes, no, option);
  row.append(box);
}

function adviceCard(item) {
  const { advice, savings } = item;
  const byId = new Map(savings.options.map((o) => [o.id, o]));
  const card = el('div', { class: 'card' },
    el('span', { class: 'tag' + (item.isSpike ? ' spike' : ''), textContent: `${item.category}${item.isSpike ? ' · spike' : ''}` }),
    el('h3', { textContent: advice.headline }),
    el('p', { textContent: advice.explanation }));
  for (const o of advice.options) if (byId.has(o.id)) card.append(optionRow(item.category, o.text, byId.get(o.id)));
  if (!advice.options.length) card.append(el('p', { class: 'muted', textContent: 'No savings options right now.' }));
  card.append(el('p', { class: 'muted', textContent: advice.source === 'ai' ? 'Written by AI from figures computed by Budget Guardian.' : 'Written by Budget Guardian.' }));
  return card;
}

async function approveOption(box, yes, no, option) {
  yes.disabled = no.disabled = true;
  yes.textContent = 'Approving…';
  box.querySelector('.error')?.remove();
  try {
    const approval = await api('/api/approvals', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ optionId: option.id, expectedAmountCents: option.savingsCents, confirm: true }),
    });
    await loadApprovals();
    await load();
    poll(approval.id);
  } catch (err) {
    if (err.status === 409) {
      box.append(el('p', { class: 'error', textContent: `${err.message}. Refreshing with the new figures…` }));
      setTimeout(load, 2500);
      return;
    }
    box.append(el('p', { class: 'error', textContent: `Not approved: ${err.message}` }));
    yes.disabled = no.disabled = false;
    yes.textContent = `Yes, move ${usd(option.savingsCents)} to savings`;
  }
}

// Checks PayPal a few times until the payout settles.
async function poll(id, tries = 6) {
  for (let i = 0; i < tries; i++) {
    await new Promise((r) => setTimeout(r, 4000));
    const a = await api(`/api/approvals/${id}`).catch(() => null);
    if (!a || a.status === 'completed' || a.status === 'failed') break;
  }
  await loadApprovals();
  load();
}

async function loadApprovals() {
  approvals = await api('/api/approvals');
  const box = document.getElementById('approvals');
  box.replaceChildren();
  if (!approvals.length) return box.append(el('p', { class: 'muted', textContent: 'None yet. Nothing moves until you approve.' }));
  const table = el('table', {}, el('tr', {}, ...['When', 'What', 'Amount', 'Status'].map((h) => el('th', { textContent: h }))));
  for (const a of approvals) {
    const status = el('td', { class: `status ${a.status}`, textContent: STATUS_TEXT[a.status] + (a.paypalStatus ? ` (${a.paypalStatus})` : '') });
    if (a.error) status.append(el('div', { class: 'error', textContent: a.error }));
    table.append(el('tr', {}, el('td', { textContent: a.createdAt.slice(0, 16).replace('T', ' ') }), el('td', { textContent: a.description }), el('td', { textContent: usd(a.amountCents) }), status));
  }
  box.append(table);
}

async function load() {
  const data = await api('/api/advice?category=entertainment');
  month = data.month;
  document.getElementById('sub').textContent = `${data.month}, day ${data.daysElapsed} of ${data.daysInMonth}. Nothing moves until you approve.`;
  const box = document.getElementById('advice');
  box.replaceChildren(...[...data.spikes, ...data.others].map(adviceCard));

  const { habits } = await api('/api/habits');
  const hb = document.getElementById('habits');
  hb.replaceChildren(...(habits.length ? habits : []).map((h) => el('div', { class: 'card' },
    el('span', { class: 'tag', textContent: h.category }),
    el('h3', { textContent: `${h.label}: ${usd(h.monthlyCents)}/month` }),
    el('p', { textContent: `About ${h.perMonth} times a month at ${usd(h.averageCents)} (${h.merchants.join(', ')}), ${usd(h.yearlyCents)} a year. Cutting to ${h.cutBack.perMonth} a month would save ${usd(h.cutBack.savingsPerMonthCents)}/month, ${usd(h.cutBack.savingsPerYearCents)}/year.` }))));
  if (!habits.length) hb.append(el('p', { class: 'muted', textContent: 'No habits found.' }));
}

loadApprovals().then(load).catch((err) => { document.getElementById('sub').textContent = `Could not load: ${err.message}`; });
</script>
</body>
</html>
