# Render Blueprint: one web service with a persistent disk for the SQLite database.
# Deploy from the Render Dashboard: New > Blueprint > this repo. Render asks for every
# `sync: false` value once; never put secrets in this file (the repo is public).
services:
  - type: web
    name: budget-guardian
    runtime: node
    plan: 0.5c-512mb # smallest paid plan; the free plan has no persistent disk
    region: singapore
    buildCommand: npm ci && npm run build
    # Seeds the demo history when it doesn't run through today yet (first start, or a new day).
    startCommand: node scripts/seed.js --if-stale && npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DB_PATH
        value: /var/data/budget-guardian.db
      # Rolling demo: the seeded history is regenerated to end today when a new day starts,
      # so live PayPal sandbox purchases land in the current month. The dashboard labels it.
      - key: DEMO_ROLLING
        value: "1"
      # Per-visitor demo: each visitor gets their own copy (src/workspaces.js), so one
      # judge's approvals, uploads or connected banks never change what the next one sees.
      - key: WORKSPACES
        value: "1"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SAVINGS_RECEIVER_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Open models (Groq by default): answer first, Gemini is the fallback. Leave empty for Gemini only.
      - key: AI_API_KEY
        sync: false
      # Plaid (banks and credit cards). Leave empty to turn it off.
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      # Protects POST /api/categorize (spends LLM quota) on the public deployment.
      - key: ADMIN_TOKEN
        generateValue: true
